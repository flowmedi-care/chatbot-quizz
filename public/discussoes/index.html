<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discussões — Papa Vagas</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#101d33" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/discussoes.css" />
  </head>
  <body class="disc-page">
    <div class="wrap disc-wrap">
      <nav class="site-nav" aria-label="Principal">
        <a class="site-nav-brand" href="/">
          <img class="brand-mark" src="/img/logo.svg" width="40" height="40" alt="" />
          <strong>Papa Vagas</strong>
        </a>
        <div class="site-nav-links" id="site-nav-links">
          <a href="/atividades" class="site-nav-link">Hoje</a>
          <a href="/hub" class="site-nav-link">Ranking</a>
          <a href="/discussoes" class="site-nav-link is-accent">Discussões</a>
          <a href="/engajamento" class="site-nav-link">Matérias</a>
        </div>
      </nav>

      <header class="disc-hero">
        <h1>Discussões</h1>
        <p>
          Comentários sobre gabaritos do grupo — vindos do WhatsApp (reply) ou daqui do site.
          Use o botão <strong>WPP</strong> para o bot anunciar um comentário no grupo.
        </p>
        <label class="disc-who">
          <span>Quem sou eu</span>
          <select id="disc-user" aria-label="Selecionar participante"></select>
        </label>
      </header>

      <p id="disc-status" class="disc-status" role="status" aria-live="polite"></p>

      <div class="disc-layout">
        <aside class="disc-list-panel" aria-label="Questões em discussão">
          <div id="disc-feed" class="disc-feed"></div>
        </aside>
        <section class="disc-thread-panel" aria-label="Thread">
          <div id="disc-thread-empty" class="disc-empty">
            Selecione uma questão à esquerda para ver e comentar a thread.
          </div>
          <div id="disc-thread" class="disc-thread" hidden></div>
        </section>
      </div>
    </div>
    <script src="/js/discussoes.js"></script>
  </body>
</html>
