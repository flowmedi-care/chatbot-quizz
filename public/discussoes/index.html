<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discussões — Papa Vagas</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#101d33" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/discussoes.css" />
  </head>
  <body class="disc-page">
    <div class="disc-shell">
      <nav class="site-nav disc-nav" aria-label="Principal">
        <a class="site-nav-brand" href="/">
          <img class="brand-mark" src="/img/logo.svg" width="40" height="40" alt="" />
          <strong>Papa Vagas</strong>
        </a>
        <div class="site-nav-links" id="site-nav-links">
          <a href="/atividades" class="site-nav-link">Hoje</a>
          <a href="/hub" class="site-nav-link">Ranking</a>
          <a href="/discussoes" class="site-nav-link is-accent">Discussões</a>
          <a href="/engajamento" class="site-nav-link">Matérias</a>
        </div>
      </nav>

      <div class="disc-board">
        <!-- 1 Quem sou eu -->
        <div class="disc-who-box">
          <h1 class="disc-title">Discussões</h1>
          <label class="disc-who">
            <span>Quem sou eu</span>
            <select id="disc-user" aria-label="Selecionar participante"></select>
          </label>
          <p id="disc-status" class="disc-status" role="status" aria-live="polite"></p>
        </div>

        <!-- 2 Filtros -->
        <div class="disc-filters-bar" id="disc-filters">
          <label class="disc-filter">
            <span>Dia no feed</span>
            <select id="filter-day" aria-label="Filtrar por dia"></select>
          </label>
          <label class="disc-filter">
            <span>Meu vínculo</span>
            <select id="filter-role" aria-label="Filtrar por engajamento">
              <option value="engaged_passive" selected>Engajado + passivo</option>
              <option value="engaged">Só engajado</option>
              <option value="passive">Só passivo</option>
              <option value="all">Todos os cadernos</option>
            </select>
          </label>
          <label class="disc-filter">
            <span>Caderno</span>
            <select id="filter-caderno" aria-label="Filtrar por caderno">
              <option value="__all__">Todos (do vínculo)</option>
            </select>
          </label>
          <label class="disc-filter">
            <span>Comentários</span>
            <select id="filter-comments" aria-label="Filtrar por comentários">
              <option value="all">Todas</option>
              <option value="with">Com discussão</option>
              <option value="without">Sem discussão</option>
            </select>
          </label>
          <label class="disc-filter">
            <span>Eu na thread</span>
            <select id="filter-mine" aria-label="Filtrar pela minha participação">
              <option value="all">Todas</option>
              <option value="mine">Que eu comentei ou respondi</option>
              <option value="not_mine">Que eu não participei</option>
            </select>
          </label>
        </div>

        <!-- 3 Lista de questões -->
        <aside class="disc-list-panel" aria-label="Questões">
          <div class="disc-panel-label">Questões</div>
          <div id="disc-feed" class="disc-feed"></div>
        </aside>

        <!-- 4–6 Detalhe -->
        <section class="disc-main-panel" aria-label="Detalhe da discussão">
          <div id="disc-thread-empty" class="disc-empty">
            Selecione uma questão à esquerda.
          </div>
          <div id="disc-thread" class="disc-thread" hidden></div>
        </section>
      </div>
    </div>
    <script src="/js/discussoes.js"></script>
  </body>
</html>
