<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omissas — Papa Vagas</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <meta name="theme-color" content="#1e3a5f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body class="omissas-page">
    <div class="wrap omissas-wrap">
      <header class="omissas-top">
        <a href="/" class="omissas-brand">
          <img class="brand-mark" src="/img/logo-papa-vagas.png" width="36" height="36" alt="" />
          Papa Vagas
        </a>
        <p class="omissas-kicker">Suas omissas · sessão pessoal</p>
      </header>

      <div id="omissas-error" class="error-banner hidden" role="alert"></div>
      <div id="omissas-loading" class="omissas-loading">Carregando sua sessão…</div>

      <section id="omissas-quiz" class="omissas-card hidden" aria-live="polite">
        <div class="omissas-card-head">
          <div>
            <h1 id="q-title" class="omissas-q-title">Questão</h1>
            <p id="q-meta" class="omissas-q-meta"></p>
          </div>
          <p id="q-progress" class="omissas-progress" aria-label="Progresso"></p>
        </div>
        <div id="q-statement" class="statement-box"></div>
        <label class="omissas-comment-field">
          <span>Comentário (opcional)</span>
          <textarea
            id="q-comment"
            rows="3"
            maxlength="2000"
            placeholder="Ex.: justificativa da alternativa…"
          ></textarea>
        </label>
        <div id="q-choices" class="choice-grid"></div>
        <p id="q-status" class="omissas-status hidden"></p>
      </section>

      <section id="omissas-results" class="omissas-card hidden">
        <h1 class="omissas-q-title">Resultado da sessão</h1>
        <div id="results-summary" class="omissas-summary"></div>
        <div id="results-list" class="omissas-results-list"></div>
        <p class="omissas-footnote">
          Respostas gravadas como no WhatsApp (contam para omissas, streak e Aura).
        </p>
      </section>
    </div>
    <script src="/js/omissas.js" defer></script>
  </body>
</html>
